name: Check portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local links, assets, and page structure
        run: python3 scripts/check-site.py
